name: Package v4

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: package-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: x64
          - os: windows-latest
            arch: x64
          - os: macos-latest
            arch: arm64
          - os: macos-15-intel
            arch: x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Validate release tag
        if: startsWith(github.ref, 'refs/tags/')
        run: node -e "if (process.env.GITHUB_REF_NAME !== 'v' + require('./package.json').version) process.exit(1)"
      - run: npm ci
      - run: npm run check
      - run: npm audit --audit-level=low
      - run: npm run test:media
      - name: Build installers without publishing
        if: github.event_name == 'workflow_dispatch'
        run: npm run build -- --${{ matrix.arch }}
      - name: Upload installers to a draft release
        if: startsWith(github.ref, 'refs/tags/')
        run: npm run release -- --${{ matrix.arch }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: yt-dlandcut-${{ runner.os }}-${{ matrix.arch }}
          if-no-files-found: error
          path: |
            dist/*.AppImage
            dist/*.exe
            dist/*.dmg
            dist/*.blockmap
            dist/*.yml
